[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gerador-ideias-negocios"
version = "0.1.0"
description = "Gerador de Ideias de Negócios com IA - Projeto Fullstack para Portfólio"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.36",
  "python-multipart==0.0.9",
  "pydantic==2.9.2",
]
requires-python = ">=3.8"
authors = [{name = "Seu Nome", email = "seu@email.com"}]

[project.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

